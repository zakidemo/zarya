name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: runtime/rust
        run: cargo test --release --offline
      - name: Build
        working-directory: runtime/rust
        run: cargo build --release --offline
      - name: Label check
        shell: bash
        run: |
          exe=runtime/rust/target/release/zarya
          if [ -f "$exe.exe" ]; then exe="$exe.exe"; fi
          python -I -X utf8 label_check/marker_check.py "$exe"
      - name: Attack demo
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-sqlite3
          python -I -X utf8 run_demo.py --zarya runtime/rust/target/release/zarya
